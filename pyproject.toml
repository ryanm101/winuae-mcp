[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "winuae-mcp"
version = "0.1.0"
description = "Dependency-free stdio MCP debugger server for reinauer/WinUAE"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
winuae-mcp = "winuae_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
